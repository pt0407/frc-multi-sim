name = "2910-hightide"
# real 2910 robot GLB — Z-up Onshape export, x90 to upright
mass = 60.0
half_extents = [0.53, 0.315, 0.64]
max_force = 1200.0
drivetrain = "swerve"

[model]
# Robot 2 top-level assembly export — named part hierarchy preserved
# (62-R2 Hopper, 42-R2 Intake, Pivoting Intake, 32-R2 Shooter & Feeder,
# 4x SDS MK5n swerve, 22-2026 R2 Drivebase). Z-up, meters; -90°X uprights it.
url = "/robot-assets/2910-r2.glb"
scale = 1.0
offset = [0.0, -0.25, -0.09]
rotation_deg = [-90.0, 0.0, 0.0]

[sensors]
preset = "competition"

# front intake — 2910's real intake is a low front roller array
[intake]
# origin rides the deployed arm center (~0.67 fwd, 0.18 up) when the
# mech is fitted — box reaches ground fuel around/below the arm
x_min = -0.75
x_max = 0.35
z_min = -0.55
z_max = 0.55
y_min = -0.55
y_max = 0.0
# hopper capacity: preload 8 + room for a few more scoops before it jams
capacity = 12

# intake arm — pivots at the front bumper, deploys down to scoop fuel.
# Deployed (<0.5 rad) is required for intake captures; the arm tip also
# becomes the intake origin so it reaches ground-level pieces.
[[mech]]
pivot = [0.33, 0.30, 0.0]
half_extents = [0.25, 0.03, 0.14]
mass = 3.5
stow_angle = 1.2
limits = [-0.5, 1.3]
motor_stiffness = 300.0
motor_damping = 30.0
motor_max_force = 400.0

# --- kinematic mechanism joints ([[joint]] = MoSim-style components) ---
# Server simulates each joint's state (accel-limited motor model) and
# streams it to the viz, which binds the named CAD subtrees. Wheel joints
# bind before steer so nested wheel geometry claims its meshes first.

# swerve wheels: omega = chassis speed along steer dir / radius. MK5
# molded wheel ~4" diameter -> 0.05 m radius.
[[joint]]
name = "swerve-wheel"
mode = "wheel"
driver = "command"
mv = '^SDS MK5 Molded Wheel$'
wheel_radius = 0.05
max_vel = 60.0
accel = 120.0

# swerve turrets: yaw servo toward each module's commanded steer angle.
[[joint]]
name = "swerve-steer"
mode = "steer"
driver = "command"
mv = '^SDS MK5 Turret Assembly$'
max_vel = 6.0     # rad/s steer speed
accel = 18.0

# intake rollers: spin while intake is active (they're inside the arm
# subtree so they swing down with it AND spin)
[[joint]]
name = "intake-rollers"
mode = "spin"
driver = "intake"
mv = 'Roller Deadaxle|2" Roller Assembly'
max_vel = 18.0
accel = 30.0
# roller contact zone, ARM-LOCAL (on_arm): origin at the mech pivot
# [0.33,0.30,0], +x along the arm — equals chassis [0.55,0.15,0] at the
# deployed angle (-0.5 rad) and swings up with the arm when stowed.
# Spinning rollers drag free pieces toward the intake AABB.
roller_pos = [0.27, -0.03, 0.0]
on_arm = true
roller_radius = 0.30
# roller axle is lateral (arm-local z); negative sign makes the intake
# driver's positive spin drag fuel inward via surface velocity ω × r
# (MoSim InteractionRoller) — reverse spin would eject pieces
roller_axis = [0.0, 0.0, -1.0]

# shooter: blades, drum, compliant wheels, hood/feed rollers — one joint,
# every matched subtree shares the flywheel angle. Spins up on shoot
# requests or shooter_on, shots gate on reaching speed.
[[joint]]
name = "shooter"
mode = "spin"
driver = "shooter"
mv = 'Blades|Main Drum|Compliant Wheel|Thin Aluminum Roller|Hood Roller'
scope = '32 - R2 Shooter'
# physical flywheel speed: ~40 RPS = 250 rad/s (their RPM table tops ~2900);
# 1.2 s spin-up per MoSim FlywheelBehaviour
max_vel = 250.0
accel = 210.0
# compression-wheel exit radius (62 mm wheel): launch speed =
# vel·radius·1.8 — physics-derived, not agent-declared
launch_radius = 0.031
# muzzle in chassis frame: shooter exits forward of the CoM at mechanism
# height — pieces launch from here, not the chassis center
muzzle_pos = [0.40, 0.55, 0.0]

# vision camera (AprilTag localization): front-mounted, sees perimeter +
# hub tags for pose estimates. Detected ids stream in SensorFrame.vision_tags;
# vision_pose only publishes while a tag is in view.
[camera]
pos = [0.30, 0.45, 0.0]
yaw = 0.0
hfov_deg = 80.0
vfov_deg = 60.0
max_range = 10.0
