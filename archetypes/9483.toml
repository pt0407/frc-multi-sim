name = "9483-overcharge"
# Team 9483 "Overcharge" — MoSim decompile constants (docs/mosim-robots.md).
# Turret + hood + intake + spindexer + feeder + shooter; SWM
# shoot-on-move with translation feed-forward + pass wall bias.
# Placeholder kitbot visuals until real 9483 CAD is supplied.
mass = 60.0
half_extents = [0.50, 0.30, 0.60]
max_force = 1200.0
drivetrain = "swerve"

[model]
url = "/robot-assets/kitbot-2026.glb"
scale = 0.72
offset = [-0.30, 0.0, 0.05]
rotation_deg = [90.0, 0.0, -90.0]

[sensors]
preset = "competition"

[intake]
x_min = -0.70
x_max = 0.35
z_min = -0.50
z_max = 0.50
y_min = -0.55
y_max = 0.0
capacity = 12

[[mech]]
pivot = [0.30, 0.30, 0.0]
half_extents = [0.25, 0.03, 0.14]
mass = 3.5
stow_angle = 1.2
limits = [-0.5, 1.3]
motor_stiffness = 300.0
motor_damping = 30.0
motor_max_force = 400.0

# turret — MoSim turretErrorTolerance=2deg, SWM feed-forward constants
# (turretSteerFeedForwardConstant=3.5, groundYawCorrectionGain=0.8,
# swmGroundCorrectionSmoothingTime=0.03s) are implemented globally in
# World::turret_lead; enableShootOnMove + shootingBrakeTime=0.3s are
# agent-side behaviors
[[joint]]
name = "turret"
mode = "position"
driver = "turret"
mv = 'turret|Turret'
max_vel = 6.0
accel = 18.0
limits = [-3.2, 3.2]

# shooter — manualShotRpm=2000, manualHoodAngle=25deg baseline
[[joint]]
name = "shooter"
mode = "spin"
driver = "shooter"
mv = 'shooter|Shooter|spindexer|Spindexer|feeder|Feeder'
max_vel = 210.0
accel = 180.0
launch_radius = 0.035
muzzle_pos = [0.40, 0.55, 0.0]
feed_path = [[0.34, 0.50, 0.0]]
shot_table = [
  { distance = 1.5, flywheel = 0.35, hood = 0.18 },
  { distance = 3.0, flywheel = 0.55, hood = 0.30 },
  { distance = 4.5, flywheel = 0.75, hood = 0.44 },
  { distance = 6.0, flywheel = 0.90, hood = 0.55 },
  { distance = 8.0, flywheel = 1.00, hood = 0.61 },
]

# hood — 0-35deg MoSim range
[[joint]]
name = "hood"
mode = "position"
driver = "hood"
mv = 'hood|Hood'
max_vel = 5.0
accel = 15.0
limits = [0.0, 0.61]

# spindexer + feeder rollers — MoSim spindexerRpm=feederRpm=2000,
# intake-driven approximation (they really run during feed)
[[joint]]
name = "spindexer"
mode = "spin"
driver = "intake"
mv = 'spindexer|Spindexer'
max_vel = 210.0
accel = 120.0

[[joint]]
name = "feeder"
mode = "spin"
driver = "intake"
mv = 'feeder|Feeder'
max_vel = 210.0
accel = 120.0

[[joint]]
name = "intake-rollers"
mode = "spin"
driver = "intake"
mv = 'intake|Intake'
max_vel = 40.0
accel = 40.0
roller_pos = [0.45, 0.15, 0.0]
roller_radius = 0.30
roller_axis = [0.0, 0.0, -1.0]

[camera]
pos = [0.30, 0.45, 0.0]
yaw = 0.0
hfov_deg = 80.0
vfov_deg = 60.0
max_range = 10.0
