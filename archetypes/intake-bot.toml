# Example archetype with an intake region (issue #3).
# The [intake] AABB is chassis-relative (+x forward); pieces inside it are
# captured while the agent's actuator frame has intake_active = true.
name = "intake-bot"
mass = 55.0
half_extents = [0.4, 0.4, 0.4]
max_force = 1500.0
drivetrain = "swerve"
# games this archetype is built for (issue #23); the server warns when
# it's paired with a game not in this list. Omit/empty = any game.
compatible_games = ["rebuilt"]

[intake]
x_min = 0.3
x_max = 0.9
z_min = -0.4
z_max = 0.4
y_min = -0.45
y_max = 0.0

# Visual model (issue #43): 2026 KitBot GLB from the AdvantageScope asset
# packages (see web/ASSETS.md; `cd web && npm run fetch-assets`). The web
# client renders this instead of the fallback box when the file is present.
# rotation/offset replicate the bundle's config.json pose fix; physics is
# still the cuboid above — this is display-only.
[model]
url = "/robot-assets/kitbot-2026.glb"
scale = 1.0
offset = [-0.30, 0.0, 0.05]
rotation_deg = [90.0, 0.0, 90.0]

# Articulated intake arm (issue #57 SPIKE): a revolute-jointed bar pinned
# to the front-top bumper corner, position-servoed by the actuator frame's
# `mech.target` (radians, clamped to `limits`). Deployed angle ≈ -0.6 sweeps
# the bar down to floor level in front of the bumper to physically push
# pieces; stow_angle keeps it up out of the way.
[[mech]]
pivot = [0.40, 0.35, 0.0]
half_extents = [0.35, 0.03, 0.35]
mass = 4.0
stow_angle = 1.3
limits = [-0.6, 1.4]
motor_stiffness = 300.0
motor_damping = 30.0
motor_max_force = 400.0

# Sensor noise + vision latency model (issue #7).
# presets: "off" (default), "clean", "competition"
[sensors]
preset = "competition"
