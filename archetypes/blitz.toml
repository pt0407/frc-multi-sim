name = "blitz"
# Team "Blitz" — MoSim decompile constants (docs/mosim-robots.md).
# Dual intake pivots (modeled as one arm), hoodPivot, intake vision
# array (8-zone, GamePiece1 layer — approximated by our camera),
# auto-deploy + pass-arc trajectory params are agent-side.
# manualShotRpm=5000 — highest in the game -> fastest flywheel.
# Placeholder kitbot visuals until real Blitz CAD is supplied.
mass = 58.0
half_extents = [0.50, 0.30, 0.58]
max_force = 1250.0
drivetrain = "swerve"

[model]
url = "/robot-assets/kitbot-2026.glb"
scale = 0.72
offset = [-0.30, 0.0, 0.05]
rotation_deg = [90.0, 0.0, -90.0]

[sensors]
preset = "competition"

[intake]
x_min = -0.70
x_max = 0.35
z_min = -0.50
z_max = 0.50
y_min = -0.55
y_max = 0.0
capacity = 12

# intake pivot — MoSim intakeAutoDeployMode=Both with velocity/dot
# thresholds (autoDeployVelocityThreshold=0.5, dotThreshold=0.5);
# intakeBringupDelay=0.15s not modeled
[[mech]]
pivot = [0.30, 0.30, 0.0]
half_extents = [0.25, 0.03, 0.14]
mass = 3.5
stow_angle = 1.2
limits = [-0.5, 1.3]
motor_stiffness = 300.0
motor_damping = 30.0
motor_max_force = 400.0

# shooter — manualShotRpm=5000 (~520 rad/s real); we cap at 400 rad/s
# since launch_radius already converts to exit speed
[[joint]]
name = "shooter"
mode = "spin"
driver = "shooter"
mv = 'Launcher|55T HTD Belt|shooter|Shooter|indexer|Indexer|dead|Dead'
max_vel = 400.0
accel = 300.0    # high-RPM flywheel spools fast
launch_radius = 0.030
muzzle_pos = [0.40, 0.55, 0.0]
feed_path = [[0.34, 0.50, 0.0]]
shot_table = [
  { distance = 1.5, flywheel = 0.30, hood = 0.18 },
  { distance = 3.0, flywheel = 0.50, hood = 0.30 },
  { distance = 4.5, flywheel = 0.70, hood = 0.44 },
  { distance = 6.0, flywheel = 0.90, hood = 0.55 },
  { distance = 8.0, flywheel = 1.00, hood = 0.61 },
]

# hood pivot — hoodRpmReduction=1.25 -> mild derate; manualHoodAngle=25deg
[[joint]]
name = "hood"
mode = "position"
driver = "hood"
mv = 'KB-26008: Hood|Hood Plate Spacer'
max_vel = 4.0    # 5.0 / 1.25
accel = 12.0
limits = [0.0, 0.61]

# rollers — MoSim: shooter, hood, indexer, dead, L/R intake, sideFeeder.
# intakeRpm=indexerRPM=2000; dead rollers are unpowered (omitted — they'd
# be passive mesh nodes, not driven joints)
[[joint]]
name = "intake-rollers"
mode = "spin"
driver = "intake"
mv = 'Roller Shaft|Intake Shaft|Dead Zone Noodle|Flap'
max_vel = 40.0
accel = 40.0
roller_pos = [0.45, 0.15, 0.0]
roller_radius = 0.30
roller_axis = [0.0, 0.0, -1.0]

[[joint]]
name = "indexer"
mode = "spin"
driver = "intake"
mv = 'Intake Shaft Small Spacer|sideFeeder|SideFeeder'
max_vel = 210.0
accel = 120.0

# vision: MoSim uses an 8-zone GamePiece1 intake array — our camera gives
# AprilTag pose + detections; piece-vision zoning is a future sensor type
[camera]
pos = [0.30, 0.45, 0.0]
yaw = 0.0
hfov_deg = 80.0
vfov_deg = 60.0
max_range = 10.0
