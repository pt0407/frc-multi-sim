name = "simbotics"
# Team "Simbotics" — MoSim decompile constants (docs/mosim-robots.md).
# Intake slide + kicker (stow -10deg) + hood; manualShotRpm=3000,
# manualHoodAngle=5deg — a flat, fast shooter unlike the hood bots.
# Placeholder kitbot visuals until real Simbotics CAD is supplied.
mass = 60.0
half_extents = [0.50, 0.30, 0.60]
max_force = 1200.0
drivetrain = "swerve"

[model]
url = "/robot-assets/kitbot-2026.glb"
scale = 0.72
offset = [-0.30, 0.0, 0.05]
rotation_deg = [90.0, 0.0, -90.0]

[sensors]
preset = "competition"

[intake]
x_min = -0.70
x_max = 0.35
z_min = -0.50
z_max = 0.50
y_min = -0.55
y_max = 0.0
capacity = 12

# intake slide — MoSim intake slide joint + intakeBringinDistance=6,
# intakeAgitateSpeed=0.55 agitation; modeled as the mech arm
[[mech]]
pivot = [0.30, 0.30, 0.0]
half_extents = [0.25, 0.03, 0.14]
mass = 3.5
stow_angle = 1.2
limits = [-0.5, 1.3]
motor_stiffness = 300.0
motor_damping = 30.0
motor_max_force = 400.0

# kicker — MoSim kickerStowAngle=-10deg = -0.17 rad; agent-commanded
[[joint]]
name = "kicker"
mode = "position"
driver = "command"
mv = 'kicker|Kicker'
max_vel = 4.0
accel = 10.0
limits = [-0.3, 0.6]

# shooter — manualShotRpm=3000 (~314 rad/s); hoodRpmReduction=1.5
[[joint]]
name = "shooter"
mode = "spin"
driver = "shooter"
mv = 'Launcher|55T HTD Belt|shooter|Shooter|intake|Intake|indexer|Indexer|uptake|Uptake|final|Final'
max_vel = 315.0
accel = 250.0
launch_radius = 0.032
muzzle_pos = [0.40, 0.55, 0.0]
feed_path = [[0.34, 0.50, 0.0]]
# flat shooter: manualHoodAngle=5deg -> hood stays near 0.09 rad even at
# max range; flywheel does the work (their shootTimeOfFlight=1.2s)
shot_table = [
  { distance = 1.5, flywheel = 0.30, hood = 0.05 },
  { distance = 3.0, flywheel = 0.50, hood = 0.07 },
  { distance = 4.5, flywheel = 0.70, hood = 0.09 },
  { distance = 6.0, flywheel = 0.90, hood = 0.09 },
  { distance = 8.0, flywheel = 1.00, hood = 0.09 },
]

# hood pivot — hoodAngleLockTolerance=0.1 rad in MoSim (matches our gate)
[[joint]]
name = "hood"
mode = "position"
driver = "hood"
mv = 'KB-26008: Hood|Hood Plate Spacer'
max_vel = 3.3    # 5.0 / 1.5 hoodRpmReduction
accel = 10.0
limits = [0.0, 0.61]

# rollers — MoSim groups: intake, indexer, uptake, shooter, hood,
# final + intake slide. intakeRpm cluster ~2000.
[[joint]]
name = "intake-rollers"
mode = "spin"
driver = "intake"
mv = 'Roller Shaft|Intake Shaft|Dead Zone Noodle|Flap'
max_vel = 40.0
accel = 40.0
roller_pos = [0.45, 0.15, 0.0]
roller_radius = 0.30
roller_axis = [0.0, 0.0, -1.0]

[[joint]]
name = "indexer-uptake"
mode = "spin"
driver = "intake"
mv = 'Intake Shaft Small Spacer'
max_vel = 210.0
accel = 120.0

[camera]
pos = [0.30, 0.45, 0.0]
yaw = 0.0
hfov_deg = 80.0
vfov_deg = 60.0
max_range = 10.0
