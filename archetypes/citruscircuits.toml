name = "citruscircuits"
# Team "CitrusCircuits" — MoSim decompile constants (docs/mosim-robots.md).
# Dual-axis hopper (vertical Y + horizontal Z), intakePivot, hoodPivot.
# manualShotRpm=2000, manualHoodAngle=25deg; hopper feed latch
# (hopperWantsOpen/shooterReadyLatched) is agent-side logic.
# Placeholder kitbot visuals until real CAD is supplied.
mass = 60.0
half_extents = [0.50, 0.30, 0.60]
max_force = 1200.0
drivetrain = "swerve"

[model]
url = "/robot-assets/kitbot-2026.glb"
scale = 0.72
offset = [-0.30, 0.0, 0.05]
rotation_deg = [90.0, 0.0, -90.0]

[sensors]
preset = "competition"

[intake]
x_min = -0.70
x_max = 0.35
z_min = -0.50
z_max = 0.50
y_min = -0.55
y_max = 0.0
capacity = 12

# intake pivot — intakeRpm=2000, intakeBringupAngle=-40deg,
# intakeBringupDelay=0.15s (delay not modeled)
[[mech]]
pivot = [0.30, 0.30, 0.0]
half_extents = [0.25, 0.03, 0.14]
mass = 3.5
stow_angle = 1.2
limits = [-0.5, 1.3]
motor_stiffness = 300.0
motor_damping = 30.0
motor_max_force = 400.0

# dual-axis hopper — MoSim verticalHopper (Y) + horizontalHopper (Z);
# modeled as two command joints. hopperBringdownDelay=0.1s not modeled.
[[joint]]
name = "hopper-vertical"
mode = "position"
driver = "command"
mv = 'verticalHopper|VerticalHopper|hopper|Hopper'
max_vel = 3.0
accel = 8.0
limits = [-0.4, 0.4]

[[joint]]
name = "hopper-horizontal"
mode = "position"
driver = "command"
mv = 'horizontalHopper|HorizontalHopper'
max_vel = 3.0
accel = 8.0
limits = [-0.4, 0.4]

# shooter — manualShotRpm=2000, manualHoodAngle=25deg
[[joint]]
name = "shooter"
mode = "spin"
driver = "shooter"
mv = 'shooter|Shooter|hood|Hood'
max_vel = 210.0
accel = 180.0
launch_radius = 0.035
muzzle_pos = [0.40, 0.55, 0.0]
feed_path = [[0.34, 0.50, 0.0]]
shot_table = [
  { distance = 1.5, flywheel = 0.35, hood = 0.18 },
  { distance = 3.0, flywheel = 0.55, hood = 0.30 },
  { distance = 4.5, flywheel = 0.75, hood = 0.44 },
  { distance = 6.0, flywheel = 0.90, hood = 0.55 },
  { distance = 8.0, flywheel = 1.00, hood = 0.61 },
]

# hood pivot — hoodRpmReduction=1.5, hoodAngleLockTolerance=0.1 rad
[[joint]]
name = "hood"
mode = "position"
driver = "hood"
mv = 'hoodPivot|HoodPivot|hood|Hood'
max_vel = 3.3    # 5.0 / 1.5
accel = 10.0
limits = [0.0, 0.61]

# rollers — MoSim: shooter, hood, floor, uptake, intake @2000 RPM;
# uptakeRpmReduction=floorRpmReduction=1.5 derate the helpers
[[joint]]
name = "intake-rollers"
mode = "spin"
driver = "intake"
mv = 'intake|Intake'
max_vel = 40.0
accel = 40.0
roller_pos = [0.45, 0.15, 0.0]
roller_radius = 0.30
roller_axis = [0.0, 0.0, -1.0]

[[joint]]
name = "floor-uptake"
mode = "spin"
driver = "intake"
mv = 'floor|Floor|uptake|Uptake'
max_vel = 140.0  # 210 / 1.5 rpmReduction
accel = 80.0

[camera]
pos = [0.30, 0.45, 0.0]
yaw = 0.0
hfov_deg = 80.0
vfov_deg = 60.0
max_range = 10.0
