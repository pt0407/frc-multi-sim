name = "competitiveconcept"
# Team "CompetitiveConcept" (CC) — MoSim decompile constants
# (docs/mosim-robots.md). FeederRollers + intakeJoint + hopperJoint +
# hoodJoint + climber; climbing mechanism with deploy state.
# Placeholder kitbot visuals until real CC CAD is supplied.
mass = 62.0
half_extents = [0.52, 0.32, 0.62]
max_force = 1200.0
drivetrain = "swerve"

[model]
url = "/robot-assets/kitbot-2026.glb"
scale = 0.72
offset = [-0.30, 0.0, 0.05]
rotation_deg = [90.0, 0.0, -90.0]

[sensors]
preset = "competition"

[intake]
x_min = -0.70
x_max = 0.35
z_min = -0.50
z_max = 0.50
y_min = -0.55
y_max = 0.0
capacity = 12

# intake joint — MoSim intakeAngle + extendedDistance params; modeled
# as the mech arm (deploy state is agent-side _deployClimb logic)
[[mech]]
pivot = [0.30, 0.30, 0.0]
half_extents = [0.25, 0.03, 0.14]
mass = 3.5
stow_angle = 1.2
limits = [-0.5, 1.3]
motor_stiffness = 300.0
motor_damping = 30.0
motor_max_force = 400.0

# climber — MoSim climber joint with PID; agent-commanded deploy
[[joint]]
name = "climber"
mode = "position"
driver = "command"
mv = 'climber|Climber'
max_vel = 2.0
accel = 6.0
limits = [0.0, 1.5]

# hopper — MoSim hopperJoint
[[joint]]
name = "hopper"
mode = "position"
driver = "command"
mv = 'hopper|Hopper'
max_vel = 3.0
accel = 8.0
limits = [-0.35, 0.35]

# hood joint — MoSim hoodJoint
[[joint]]
name = "hood"
mode = "position"
driver = "hood"
mv = 'hood|Hood'
max_vel = 4.0
accel = 12.0
limits = [0.0, 0.61]

# shooter — MoSim roller groups: intake, indexer, shooter + feederRollers
# joint; shooter RPM is prefab-tuned (not in decompile defaults)
[[joint]]
name = "shooter"
mode = "spin"
driver = "shooter"
mv = 'shooter|Shooter|indexer|Indexer|feeder|Feeder'
max_vel = 250.0
accel = 200.0
launch_radius = 0.033
muzzle_pos = [0.40, 0.55, 0.0]
feed_path = [[0.34, 0.50, 0.0]]
shot_table = [
  { distance = 1.5, flywheel = 0.35, hood = 0.18 },
  { distance = 3.0, flywheel = 0.55, hood = 0.30 },
  { distance = 4.5, flywheel = 0.75, hood = 0.44 },
  { distance = 6.0, flywheel = 0.90, hood = 0.55 },
  { distance = 8.0, flywheel = 1.00, hood = 0.61 },
]

# feeder rollers — MoSim feederRollers joint
[[joint]]
name = "feeder-rollers"
mode = "spin"
driver = "intake"
mv = 'feeder|Feeder'
max_vel = 210.0
accel = 120.0

[[joint]]
name = "intake-rollers"
mode = "spin"
driver = "intake"
mv = 'intake|Intake'
max_vel = 40.0
accel = 40.0
roller_pos = [0.45, 0.15, 0.0]
roller_radius = 0.30
roller_axis = [0.0, 0.0, -1.0]

[camera]
pos = [0.30, 0.45, 0.0]
yaw = 0.0
hfov_deg = 80.0
vfov_deg = 60.0
max_range = 10.0
