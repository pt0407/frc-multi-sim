name = "4414-hightide"
# Team 4414 "Hightide" — mechanism constants ported from the MoSim
# decompile (docs/mosim-robots.md). Placeholder kitbot visuals until
# real 4414 CAD is supplied; joint physics is real regardless.
mass = 60.0
half_extents = [0.50, 0.30, 0.60]
max_force = 1200.0
drivetrain = "swerve"

[model]
# TODO: replace with 4414's real CAD export — node names below follow
# the MoSim binding names (turret/dyeRotor/intake/kickerBar/hood)
url = "/robot-assets/kitbot-2026.glb"
scale = 0.72
offset = [-0.30, 0.0, 0.05]
rotation_deg = [90.0, 0.0, -90.0]

[sensors]
preset = "competition"

# front intake — ground fuel around/below the deployed arm
[intake]
x_min = -0.70
x_max = 0.35
z_min = -0.50
z_max = 0.50
y_min = -0.55
y_max = 0.0
capacity = 12

# intake arm — pivots at the front, deploys down to scoop fuel
[[mech]]
pivot = [0.30, 0.30, 0.0]
half_extents = [0.25, 0.03, 0.14]
mass = 3.5
stow_angle = 1.2
limits = [-0.5, 1.3]
motor_stiffness = 300.0
motor_damping = 30.0
motor_max_force = 400.0

# turret: continuous-yaw position joint tracking ShotCommand.turret_yaw
# plus chassis-velocity lead (MoSim SWM GetShootOnMoveTarget,
# turretSteerFeedForwardConstant=6, groundYawCorrectionGain=0.8).
# Release gates at 2° = MoSim turretErrorTolerance.
[[joint]]
name = "turret"
mode = "position"
driver = "turret"
swm_lead = true   # MoSim SWM shoot-on-move (team-code behavior, opt-in)
mv = 'turret|Turret'
max_vel = 6.0    # rad/s slew
accel = 18.0
limits = [-3.2, 3.2]

# dye rotor / shooter: MoSim manualShotRpm=2000 -> ~210 rad/s top end.
# feederSpeedMultiplier=2.3 is implicit in launch_radius exit speed.
[[joint]]
name = "shooter"
mode = "spin"
driver = "shooter"
mv = 'Launcher|55T HTD Belt'
scope = 'shooter'
max_vel = 210.0
accel = 180.0     # ~1.2 s spin-up per MoSim FlywheelBehaviour
launch_radius = 0.035
muzzle_pos = [0.40, 0.55, 0.0]
feed_path = [[0.34, 0.50, 0.0]]
# MoSim Hightide interpolation: manualHoodAngle=25 deg baseline,
# distance-keyed flywheel/hood like every Rebuilt robot
shot_table = [
  { distance = 1.5, flywheel = 0.35, hood = 0.18 },
  { distance = 3.0, flywheel = 0.55, hood = 0.30 },
  { distance = 4.5, flywheel = 0.75, hood = 0.44 },
  { distance = 6.0, flywheel = 0.90, hood = 0.55 },
  { distance = 8.0, flywheel = 1.00, hood = 0.61 },
]

# hood: MoSim range 0-35 deg = 0-0.61 rad, lock tolerance 0.5 deg
# (tighter than our 0.1 rad gate — physical joint is what matters)
[[joint]]
name = "hood"
mode = "position"
driver = "hood"
mv = 'KB-26008: Hood|Hood Plate Spacer'
max_vel = 5.0
accel = 15.0
limits = [0.0, 0.61]

# intake rollers: MoSim intakeRpm=2000 -> ~210 rad/s while intake active
[[joint]]
name = "intake-rollers"
mode = "spin"
driver = "intake"
mv = 'Roller Shaft|Intake Shaft|Dead Zone Noodle|Flap'
max_vel = 40.0     # intake rollers run slower than the shooter
accel = 40.0
roller_pos = [0.45, 0.15, 0.0]
roller_radius = 0.30
roller_axis = [0.0, 0.0, -1.0]

# uptake + indexer rollers: MoSim uptakeRpm=indexerRpm=2000. They run
# during intake/feed, not while driving — approximated as intake-driven
# until a feed-state driver exists.
[[joint]]
name = "uptake-rollers"
mode = "spin"
driver = "intake"
mv = 'Intake Shaft Long Spacer'
max_vel = 210.0
accel = 120.0

[[joint]]
name = "indexer"
mode = "spin"
driver = "intake"
mv = 'Intake Shaft Small Spacer'
max_vel = 210.0
accel = 120.0

# kicker bar: deploys near the hub (MoSim kickerDeployStartMeters=0.05,
# kickerDeployDelay=0.15s — we expose it as an agent command joint and
# let code/policy handle the deploy trigger)
[[joint]]
name = "kicker-bar"
mode = "position"
driver = "command"
mv = 'kicker|Kicker'
max_vel = 4.0
accel = 10.0
limits = [0.0, 0.8]

# vision camera: turret robots aim by tags — front camera sees hub tags
[camera]
pos = [0.30, 0.45, 0.0]
yaw = 0.0
hfov_deg = 80.0
vfov_deg = 60.0
max_range = 10.0
