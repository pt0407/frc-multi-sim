[package]
name = "frc-sim-m0"
version = "0.1.0"
edition = "2021"

[dependencies]
rapier3d = "0.22"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures-util = "0.3"
nt_client = "0.5.1"
rmpv = { version = "1", features = ["with-serde"] }
toml = "0.8"
rand_core = "0.6"
rand_pcg = "0.3"
