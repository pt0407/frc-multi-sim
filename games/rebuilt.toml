# REBUILT (2026) game config — the single per-game surface (issue #23,
# PLAN C4). One `--game games/rebuilt.toml` loads the field layout, the
# piece spawn/scoring table, and the `[match]` timing/endgame rules in
# one shot; `--field`/`--pieces` still override these refs when given.
# Paths are resolved relative to this file's directory.

name   = "rebuilt"
field  = "../fields/rebuilt.toml"
pieces = "fuel.toml"

# disabled_s = 0 keeps the legacy "start enabled" behavior; raise it to
# stage a pre-match window (commands are ignored while disabled).
# auto + teleop + endgame = 150 s, the standard FRC 2:30.

[match]
disabled_s          = 0.0
auto_s              = 15.0
teleop_s            = 105.0
endgame_s           = 30.0
# placeholder climb rule: robots within climb_radius_m (horizontal) of a
# field climb point at match completion bank this bonus for their alliance
climb_bonus_points  = 10
climb_radius_m      = 1.0
