# Game-piece table: fuel spawn + hub scoring zones.
#
# Spawn layout: EXACT staged positions extracted from the MoSim REBUILT
# scene (Unity level objects "Fuel (N)", 503 pieces):
#   - 407-piece midfield stash in a hex-close-packed grid
#     (x -0.84..0.84, z -2.53..2.54, resting y ~0.077)
#   - 24-piece depot floor stash per alliance (5x5 grid minus corner)
#   - 24-piece outpost stash per alliance (MoSim stages them elevated on
#     the outpost at y 0.80..0.97, x to +-8.9 — beyond the x=+-8.27 tile
#     edge; clamped inboard to |x|<=8.145 on the floor so they stay
#     reachable inside our perimeter walls)
# Coordinate map: unity(x,y,z) -> ours(x,y,-z); west = 180-deg mirror.
# See docs/mosim-physics.md.
#
# [[zone]]  — rectangular spawn area (legacy/random staging)
# [[point]] — exact piece centre [x, y, z]
# [[hub]]   — cylinder; a piece falling through entry_height inside
#             radius scores for `alliance` (robot_id % 2)

