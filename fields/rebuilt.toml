name         = "trench-ne"
pos          = [3.645, 0.38, -2.60]
half_extents = [0.60, 0.38, 0.20]
friction     = 0.7

# BUMP — GE-261xx assembly. Floor strip between each hub and trench,
# spanning z ≈ 0.59..2.75 at x ≈ ±3.645, ~0.16 m tall.
[[obstacles]]
