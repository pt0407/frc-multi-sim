# Field layout for the simulator (issue #14, PLAN C1; real geometry: #42).
#
# 2026 REBUILT field. Obstacle positions/dims are derived from the official
# AdvantageScope field asset `Field3d_2026FRCFieldV1` (model.glb, meters,
# y-up, x = field length) — see web/ASSETS.md for provenance. Colliders are
# axis-aligned primitives chosen to bound the real field elements (hub,
# trench, bump, tower, depot); the TOML stays authoritative for physics.

name = "rebuilt-2026"
half_x = 8.2705   # meters; fieldcore reference field is 16.541 x 8.069 (issue #44)
half_z = 4.0345

# Visual model rendered by web/ when present (fetch via `npm run fetch-assets`).
glb_url = "/field-assets/rebuilt-2026.glb"
# Optional local GLB used for physics trimesh colliders when
# `glb_colliders` is true (validation option; expensive).
glb = "assets/fields/rebuilt2026/field.glb"
glb_colliders = false

[ground]
half_extents = [20.0, 0.1, 20.0]
pos          = [0.0, -0.1, 0.0]
friction     = 0.82   # fieldcore field-collider material (issue #44)
restitution  = 0.08

# --- perimeter walls -------------------------------------------------------

[[walls]]
name         = "south"
pos          = [0.0, 0.3, -4.0345]
half_extents = [8.2705, 0.6, 0.05]
friction     = 0.82
restitution  = 0.08

[[walls]]
name         = "north"
pos          = [0.0, 0.3, 4.0345]
half_extents = [8.2705, 0.6, 0.05]
friction     = 0.82
restitution  = 0.08

[[walls]]
name         = "west"
pos          = [-8.2705, 0.3, 0.0]
half_extents = [0.05, 0.6, 4.0345]
friction     = 0.82
restitution  = 0.08

[[walls]]
name         = "east"
pos          = [8.2705, 0.3, 0.0]
half_extents = [0.05, 0.6, 4.0345]
friction     = 0.82
restitution  = 0.08

# --- obstacles (GLB-derived bounding boxes; fallback when glb colliders off)
# Source: Field3d_2026FRCFieldV1 model.glb node AABBs (see web/ASSETS.md).

# HUB — GE-263xx assembly. Base plate 1.182 m square centered at x=±3.645,
# front panel reaches x=±4.236, upper opening rim at y≈2.13.
[[obstacles]]
kind         = "box"
name         = "hub-west"
pos          = [-3.645, 1.05, 0.0]
half_extents = [0.60, 1.05, 0.60]
friction     = 0.7
restitution  = 0.1

[[obstacles]]
kind         = "box"
name         = "hub-east"
pos          = [3.645, 1.05, 0.0]
half_extents = [0.60, 1.05, 0.60]
friction     = 0.7
restitution  = 0.1

# TRENCH — GE-262xx assembly. One trench per side of each hub (4 total).
# Skirt panels span z ≈ 2.45..2.76 m at x ≈ ±3.645; the hinged counter-
# balance arm runs toward the side wall at y ≈ 0.62. One box bounds both.
[[obstacles]]
kind         = "box"
name         = "trench-sw"
pos          = [-3.645, 0.38, 2.60]
half_extents = [0.60, 0.38, 0.20]
friction     = 0.7

[[obstacles]]
kind         = "box"
name         = "trench-nw"
pos          = [-3.645, 0.38, -2.60]
half_extents = [0.60, 0.38, 0.20]
friction     = 0.7

[[obstacles]]
